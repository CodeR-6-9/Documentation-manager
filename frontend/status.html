<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Status</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/status.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <h1>Government of NCT of Delhi</h1>
    </div>
    <h2 class="page-title">Certificate Issuance Portal</h2>
  </div>

  <div class="container">
    <div class="status-header">
      <h1><i class="fas fa-clipboard-check"></i> Application Status</h1>
      <p>Track your certificate request</p>
    </div>

    <div class="status-card">
      <!-- Progress Tracker -->
      <div class="progress-tracker">
        <div class="progress-step active">
          <div class="step-icon"><i class="fas fa-check"></i></div>
          <div class="step-label">Submitted</div>
        </div>
        <div class="progress-step active">
          <div class="step-icon"><i class="fas fa-spinner"></i></div>
          <div class="step-label">Under Review</div>
        </div>
        <div class="progress-step">
          <div class="step-icon"><i class="far fa-clock"></i></div>
          <div class="step-label">Verification</div>
        </div>
        <div class="progress-step">
          <div class="step-icon"><i class="fas fa-certificate"></i></div>
          <div class="step-label">Completed</div>
        </div>
      </div>

      <!-- Current Status -->
      <div class="current-status">
        <i class="fas fa-info-circle"></i>
        <span>Current Status: <strong>Under Review</strong></span>
      </div>

      <!-- Application Details -->
      <div class="status-details">
        <div class="detail-row">
          <span class="detail-label"><i class="fas fa-id-card"></i> Application ID:</span>
          <span class="detail-value" id="appId">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label"><i class="fas fa-user"></i> Name:</span>
          <span class="detail-value" id="appName">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label"><i class="fas fa-certificate"></i> Certificate Type:</span>
          <span class="detail-value" id="certType">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label"><i class="fas fa-calendar-alt"></i> Submission Date:</span>
          <span class="detail-value" id="submissionDate">-</span>
        </div>
      </div>

      <div class="actions">
        <button onclick="window.location.href='application.html'">
          <i class="fas fa-plus-circle"></i> New Application
        </button>
        <button onclick="window.print()">
          <i class="fas fa-print"></i> Print Receipt
        </button>
      </div>
    </div>
  </div>
  <script src="js/status.js"></script>
</body>
</html>
