<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate Portal - Login</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="header">
    <h1>Government of NCT of Delhi</h1>
    <h2>Certificate Issuance Portal</h2>
  </div>

  <div class="container">
    <div class="form-container">
      <form id="loginForm" class="active">
        <h3>User Login</h3>
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit">Login</button>
        <p class="toggle-form">Don't have an account? <a href="#" id="showSignup">Sign up</a></p>
      </form>

      <form id="signupForm">
        <h3>Create Account</h3>
        <input type="text" id="signupName" placeholder="Full Name" required>
        <input type="email" id="signupEmail" placeholder="Email" required>
        <input type="password" id="signupPassword" placeholder="Password" required>
        <button type="submit">Sign Up</button>
        <p class="toggle-form">Already have an account? <a href="#" id="showLogin">Login</a></p>
      </form>
    </div>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
